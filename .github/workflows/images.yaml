# Builds every image for every platform on a pull request, and publishes them
# to GHCR from main and from version tags (see ci/main.go).
name: images

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        if: github.event_name == 'pull_request'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.10"
          verb: call
          args: build-all

      # A version tag is published as itself; main as main, and as its
      # commit so a deployment can pin one.
      - name: Tags
        if: github.event_name == 'push'
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tags=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=main,sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: github.event_name == 'push'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "0.21.10"
          verb: call
          args: >-
            publish
            --tags=${{ steps.tags.outputs.tags }}
            --revision=${{ github.sha }}
            --username=${{ github.actor }}
            --password=env://GHCR_TOKEN
