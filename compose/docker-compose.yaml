services:
  postgres-ivfs:
    image: postgres:${POSTGRESQL_VERSION}
    container_name: postgres-ivfs
    # Loopback only, like every port here: the gateway runs on the host in
    # development, so the host is the internal network (ADR 0013).
    ports:
      - 127.0.0.1:5433:5432
    env_file:
      - .ivfs-pg.env
      - .ivfs-app.env
    networks:
      - ivfs-network
    volumes:
      - ./psqldata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  postgresql:
    image: postgres:${POSTGRESQL_VERSION}
    container_name: temporal-postgresql
    # Whoever reaches Temporal's database can write any run's history, user
    # header included.
    ports:
      - 127.0.0.1:5432:5432
    env_file:
      - .temporal-pg.env
    networks:
      - temporal-network
    volumes:
      - ./temporal-psqldata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-admin-tools
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - SQL_PASSWORD=temporal
    networks:
      - temporal-network
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION}
    container_name: temporal
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    networks:
      - temporal-network
    # The gateway is the only client meant to reach it: anyone else can start
    # a run with any user's header (ADR 0013).
    ports:
      - 127.0.0.1:7233:7233
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    container_name: temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    networks:
      - temporal-network
    # Not 8080, which the web gateway listens on and Authelia sends users
    # back to.
    ports:
      - 127.0.0.1:8233:8080

  temporal-worker:
    container_name: temporal-worker
    depends_on:
      temporal:
        condition: service_healthy
      postgres-ivfs:
        condition: service_healthy
    # The app role's password only: the superuser's stays with PostgreSQL,
    # which needs it to create the role (ADR 0013).
    env_file:
      - .worker.env
      - .ivfs-app.env
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: ivfs-worker:latest
    networks:
      - temporal-network
      - ivfs-network

  # An asset value provider (ADR 0014). v1 of the spec has no
  # authentication, so it is on loopback for the gateway on the host alone.
  yahoo-provider:
    build:
      context: ..
      dockerfile: providers/yahoo/Dockerfile
    image: ivfs-yahoo-provider:latest
    container_name: yahoo-provider
    ports:
      - 127.0.0.1:8081:8080

  # The development identity provider (ADR 0013). authelia-init generates
  # its keys and secrets on the first start; see authelia/configuration.yml.
  authelia-init:
    image: authelia/authelia:${AUTHELIA_VERSION}
    container_name: authelia-init
    entrypoint: ["/bin/sh"]
    command: /init.sh
    volumes:
      - ./authelia/init.sh:/init.sh:ro
      - ./authelia/secrets:/secrets

  authelia:
    image: authelia/authelia:${AUTHELIA_VERSION}
    container_name: authelia
    depends_on:
      authelia-init:
        condition: service_completed_successfully
    # Outside /config, which the image's entrypoint chowns.
    command: ["authelia", "--config", "/etc/authelia/configuration.yml"]
    environment:
      - X_AUTHELIA_CONFIG_FILTERS=template
    # Loopback only: the browser and the gateway both reach it on the host.
    ports:
      - 127.0.0.1:9091:9091
    volumes:
      - ./authelia/configuration.yml:/etc/authelia/configuration.yml:ro
      - ./authelia/users.yml:/etc/authelia/users.yml:ro
      - ./authelia/secrets:/secrets:ro
      - ./authelia/data:/data

networks:
  temporal-network:
    driver: bridge
    name: temporal-network
  ivfs-network:
    driver: bridge
    name: ivfs-network
