<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ivfs</title>
    <!-- Sets the theme before the first paint, so a dark page does not flash
         white while the app loads. Mirrors ThemeProvider and src/lib/theme.ts. -->
    <script>
      try {
        const theme = localStorage.getItem("ivfs-theme")
        const dark =
          theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
